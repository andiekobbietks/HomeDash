plugins {
    id "com.android.application"
}

// The planner's host name, kept out of the repo. Set plannerHost in ~/.gradle/gradle.properties,
// or pass -PplannerHost=..., e.g. plannerHost=your-app-name.4.azurestaticapps.net
def plannerHost = findProperty("plannerHost") ?: { throw new GradleException("Set plannerHost (see kiosk/app/build.gradle)") }()

android {
    namespace = "com.homedash.kiosk"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.homedash.kiosk"
        minSdk = 23            // the frame runs Android 6.0.1
        targetSdk = 35
        versionCode = 1
        versionName = "0.1"
        ndk { abiFilters "armeabi-v7a" }   // Allwinner A33, 32-bit ARM

        buildConfigField "String", "PLANNER_HOST", "\"${plannerHost}\""
        buildConfigField "String", "START_URL", "\"https://${plannerHost}/display\""
        // The frame boots at 1970; the browser waits until the clock is at least this (ClockGate).
        buildConfigField "long", "NOT_BEFORE_MS", "${System.currentTimeMillis() - 86_400_000L}L"
    }

    buildFeatures { buildConfig = true }

    lint {
        // Part of the test command: catches APIs newer than the frame's Android 6,
        // which unit tests on the laptop's Java can't (URLDecoder crash, 2026-11-05).
        abortOnError = true
        warningsAsErrors = false
        // GeckoView's bundled ExoPlayer posts notifications; the permission only exists on Android 13+.
        disable += "NotificationPermission"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // GeckoView 143 = Firefox 143.0.4, the last engine release for Android 5-7.
    testImplementation "junit:junit:4.13.2"
    implementation "org.mozilla.geckoview:geckoview-armeabi-v7a:143.0.20251003115653"
}
